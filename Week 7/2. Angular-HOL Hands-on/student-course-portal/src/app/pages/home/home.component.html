<div class="home-container">
  <!-- Step 11: String Interpolation -->
  <h1>{{ portalName }}</h1>

  <p class="description">
    Welcome to the central academic portal. Browse available courses, register for subjects, and track your enrollment progress.
  </p>

  <!-- Task 1 Controls -->
  <div class="interactive-panel">
    <h3>Portal Actions & Live Search</h3>
    
    <div class="action-row">
      <!-- Step 12: Property Binding & Step 13: Event Binding -->
      <button class="btn btn-primary" [disabled]="!isPortalActive" (click)="onEnrollClick()">
        Enroll Now
      </button>
      
      <span *ngIf="message" class="message-badge">{{ message }}</span>
    </div>

    <div class="search-row">
      <!-- Step 14: Two-Way Data Binding with ngModel -->
      <label for="searchInput">Search Portal Courses:</label>
      <input id="searchInput" type="text" [(ngModel)]="searchTerm" placeholder="Type course name..." class="form-input" />
      <p class="search-live-output">Searching for: <strong>{{ searchTerm }}</strong></p>
    </div>
  </div>

  <div class="stats-row">
    <div class="stat-card">
      <span class="stat-label">Courses Available</span>
      <span class="stat-value">12</span>
    </div>
    <div class="stat-card">
      <span class="stat-label">Enrolled</span>
      <span class="stat-value">3</span>
    </div>
    <div class="stat-card">
      <span class="stat-label">GPA</span>
      <span class="stat-value">3.8</span>
    </div>
  </div>
</div>
